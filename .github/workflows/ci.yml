name: ci
on:
  push:
    branches: [main, "p1/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc
      - run: bun test
      - run: bun run --cwd apps/web build
